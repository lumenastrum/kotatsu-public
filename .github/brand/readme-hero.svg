<svg viewBox="0 0 560 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kotatsu — the bubble hearth above the k●tatsu wordmark">
  <!-- README hero: a composition of the canon marks (public/kotatsu/brand/) on
       the Blue Hour ground, so it reads on GitHub's light and dark themes alike.
       Geometry is copied verbatim from bubble-hearth.svg and wordmark.svg —
       change those first, then re-copy here. Canon: docs/brand.md -->
  <defs>
    <radialGradient id="k-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dca9a4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dca9a4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="560" height="280" rx="28" fill="#0e1119"/>
  <!-- bubble hearth -->
  <g transform="translate(222.4,28) scale(1.8)">
    <path d="M18 12 h28 a8 8 0 0 1 8 8 v20 a8 8 0 0 1 -8 8 h-20 l-10 8 v-8 a8 8 0 0 1 -6 -7.7 v-20.3 a8 8 0 0 1 8 -8z" fill="none" stroke="#9aa4d2" stroke-width="5" stroke-linejoin="round"/>
    <ellipse cx="32" cy="30" rx="12" ry="8" fill="url(#k-glow)"/>
    <circle cx="32" cy="30" r="6.5" fill="#dca9a4"/>
  </g>
  <!-- wordmark "k●tatsu" -->
  <g transform="translate(148.75,152) scale(1.25)">
    <g fill="none" stroke="#b6bee2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 12 v40 M14 34 l20 -18 M19.5 29.5 l16 22.5"/>
      <path d="M68 18 v27 a7 7 0 0 0 7 7 M58 30 h19"/>
      <circle cx="98" cy="42" r="9"/>
      <path d="M107 33 v19"/>
      <path d="M126 18 v27 a7 7 0 0 0 7 7 M116 30 h19"/>
      <path d="M162 34 a8 7 0 0 0 -15 2.5 c0 7 15 3 15 10.5 a8 7 0 0 1 -15 2.5"/>
      <path d="M178 30 v13 a9 9 0 0 0 18 0 v-13 M196 43 v9"/>
    </g>
    <ellipse cx="45" cy="42" rx="11" ry="9" fill="url(#k-glow)"/>
    <circle cx="45" cy="42" r="7" fill="#dca9a4"/>
  </g>
</svg>
