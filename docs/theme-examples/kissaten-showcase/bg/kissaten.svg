<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Midnight Kissaten: the room at two in the morning. Mostly transparent: theme.json paints the
       wood-dark base and the amber lamp pools as CSS gradients under this picture. -->
  <defs>
    <filter id="smear" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="62"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1018" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#120d10" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2618"/>
      <stop offset="1" stop-color="#1a110b"/>
    </linearGradient>
    <clipPath id="pane"><rect x="1080" y="86" width="480" height="866" rx="3"/></clipPath>
    <!-- the window dissolves into the room toward the floor and toward the wall -->
    <linearGradient id="fadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dissolve" maskUnits="userSpaceOnUse" x="1040" y="60" width="560" height="940">
      <rect x="1040" y="60" width="560" height="940" fill="url(#fadeDown)"/>
    </mask>
  </defs>

  <!-- the wall: lacquered panels catching a little lamplight at their seams -->
