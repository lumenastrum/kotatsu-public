<svg xmlns="http://www.w3.org/2000/svg">
  <!-- No viewBox and no width/height on purpose (see the Shoujo pack): the picture covers the
       surface once, and the sun hangs from the top-right corner via a nested svg at x=100%. -->
  <defs>
    <path id="s" d="M0 -10 Q1.4 -1.4 10 0 Q1.4 1.4 0 10 Q-1.4 1.4 -10 0 Q-1.4 -1.4 0 -10Z"/>
    <path id="t" d="M0 -9 L8 6 L-8 6Z"/>
    <path id="ray" d="M-13 -150 L0 -214 L13 -150Z"/>
    <style>
      @media (max-width: 700px) { .cluster { transform: translate(-6px, 0) scale(0.55); } }
    </style>
  </defs>
  <svg x="100%" y="0" overflow="visible">
    <g class="cluster">
      <g transform="translate(-1610 0)">
        <!-- the sun dial from the "Light" stage: rings and long triangular rays -->
        <g transform="translate(1440 40)">
          <g fill="#f0a63c" fill-opacity="0.2">
            <use href="#ray"/>
            <use href="#ray" transform="rotate(30)"/>
            <use href="#ray" transform="rotate(60)"/>
            <use href="#ray" transform="rotate(90)"/>
            <use href="#ray" transform="rotate(120)"/>
            <use href="#ray" transform="rotate(150)"/>
            <use href="#ray" transform="rotate(180)"/>
            <use href="#ray" transform="rotate(210)"/>
            <use href="#ray" transform="rotate(240)"/>
            <use href="#ray" transform="rotate(270)"/>
            <use href="#ray" transform="rotate(300)"/>
            <use href="#ray" transform="rotate(330)"/>
          </g>
          <g fill="none" stroke="#e8952f" stroke-opacity="0.28">
            <circle r="140" stroke-width="10"/>
            <circle r="118" stroke-width="2"/>
            <circle r="96" stroke-width="1.5" stroke-dasharray="4 10"/>
          </g>
        </g>
        <!-- confetti: cyan and pink triangles -->
        <g fill="#4cc8e2" fill-opacity="0.55">
          <use href="#t" transform="translate(1196 118) rotate(-18) scale(1.3)"/>
          <use href="#t" transform="translate(1560 300) rotate(40) scale(1.1)"/>
          <use href="#t" transform="translate(1290 330) rotate(160) scale(0.8)"/>
        </g>
        <g fill="none" stroke="#ee5fae" stroke-opacity="0.6" stroke-width="2.5">
          <use href="#t" transform="translate(1250 230) rotate(22) scale(1.2)"/>
          <use href="#t" transform="translate(1585 168) rotate(-30) scale(0.9)"/>
        </g>
        <g fill="#ee5fae" fill-opacity="0.45">
          <use href="#t" transform="translate(1150 40) rotate(70) scale(0.8)"/>
        </g>
        <!-- sparkles: mint and periwinkle -->
        <g fill="#5fbf9c" fill-opacity="0.55">
          <use href="#s" transform="translate(1330 70) scale(1.4)"/>
          <use href="#s" transform="translate(1520 410) scale(1)"/>
        </g>
        <g fill="#6a5fc8" fill-opacity="0.4">
          <use href="#s" transform="translate(1228 300) scale(0.8)"/>
          <use href="#s" transform="translate(1590 92) scale(0.9)"/>
        </g>
        <!-- a little pixel burst, like the gold star's halo in the night scene -->
        <g fill="#e8742f" fill-opacity="0.4">
          <rect x="1372" y="250" width="6" height="6"/>
          <rect x="1386" y="262" width="5" height="5"/>
          <rect x="1360" y="270" width="5" height="5"/>
          <rect x="1398" y="248" width="4" height="4"/>
          <rect x="1350" y="250" width="4" height="4"/>
        </g>
      </g>
    </g>
  </svg>
</svg>
