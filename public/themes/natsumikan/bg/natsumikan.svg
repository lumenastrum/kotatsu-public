<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Natsumikan backdrop. A pack backdrop replaces the whole ambient stack (tokens.css
       --k-app-backdrop), so this file paints all of it: the cream ground, the afternoon sun,
       and Mikan-chan's hanten dots scattered like light through leaves. Colors mirror
       theme.json: ground #fbf3e3, backdrop-top #fff7ea, glows #ffb04a / #f6a7b4 / #ffd76a,
       dots = --k-rose family at whisper opacity. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0" stop-color="#fff7ea"/>
      <stop offset="1" stop-color="#f8ecd6"/>
    </linearGradient>
    <radialGradient id="sun" cx="1360" cy="-120" r="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb04a" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffc46e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blush" cx="60" cy="1120" r="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6a7b4" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#f6a7b4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="zest" cx="820" cy="1180" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd76a" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffd76a" stop-opacity="0"/>
    </radialGradient>
    <!-- The hanten print: a staggered dot lattice, rose on cream. -->
    <pattern id="dots" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
      <circle cx="16" cy="16" r="4.5" fill="#d9788c" fill-opacity="0.16"/>
      <circle cx="48" cy="48" r="4.5" fill="#d9788c" fill-opacity="0.16"/>
    </pattern>
    <!-- The dots fade in from the edges and stay out of the middle, where the prose lives. -->
    <radialGradient id="veil" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.42" stop-color="#000"/>
      <stop offset="1" stop-color="#fff"/>
    </radialGradient>
    <mask id="edges">
      <rect width="1600" height="1000" fill="url(#veil)"/>
    </mask>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect width="1600" height="1000" fill="url(#dots)" mask="url(#edges)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <rect width="1600" height="1000" fill="url(#blush)"/>
  <rect width="1600" height="1000" fill="url(#zest)"/>

  <!-- A mikan slice catching the light, top-left, barely there. -->
  <g transform="translate(150 150) rotate(-18)" opacity="0.13">
    <circle r="62" fill="#f28a1e"/>
    <circle r="52" fill="#ffd28a"/>
    <g stroke="#f28a1e" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-48"/>
      <line x1="0" y1="0" x2="34" y2="-34"/>
      <line x1="0" y1="0" x2="48" y2="0"/>
      <line x1="0" y1="0" x2="34" y2="34"/>
      <line x1="0" y1="0" x2="0" y2="48"/>
      <line x1="0" y1="0" x2="-34" y2="34"/>
      <line x1="0" y1="0" x2="-48" y2="0"/>
      <line x1="0" y1="0" x2="-34" y2="-34"/>
    </g>
    <circle r="7" fill="#fff4dc"/>
  </g>
</svg>
